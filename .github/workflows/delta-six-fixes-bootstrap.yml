name: Delta six-fix bootstrap

on:
  push:
    branches:
      - tmp/delta-six-fixes-bootstrap

permissions:
  contents: write

jobs:
  assemble-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/delta-six-fixes-bootstrap
          fetch-depth: 0
      - name: Assemble exact reviewed runtime blobs
        run: python3 .github/delta-six-fixes-assemble-runtime.py
      - name: Commit assembled runtime blobs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appearance.js continuity-core.js social.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: assemble reviewed runtime blobs"
            git push origin HEAD:tmp/delta-six-fixes-bootstrap
          fi
