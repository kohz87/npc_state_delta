name: Delta six-fix bootstrap

on:
  push:
    branches:
      - tmp/delta-six-fixes-bootstrap

permissions:
  contents: write

jobs:
  assemble-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/delta-six-fixes-bootstrap
          fetch-depth: 0
      - name: Assemble exact reviewed runtime blobs
        shell: bash
        run: |
          set -euo pipefail
          core="$(git hash-object core-mechanics.js)"
          appearance="$(git hash-object appearance.js)"
          continuity="$(git hash-object continuity-core.js)"
          social="$(git hash-object social.js)"
          [[ "$core" == 64604d9* ]]
          if [[ "$appearance" != 963b08c* || "$continuity" != 6aaa64a* || "$social" != 6958faf* ]]; then
            git apply --recount --check .github/delta-six-fixes-runtime.patch
            git apply --recount .github/delta-six-fixes-runtime.patch
          fi
          core="$(git hash-object core-mechanics.js)"
          appearance="$(git hash-object appearance.js)"
          continuity="$(git hash-object continuity-core.js)"
          social="$(git hash-object social.js)"
          echo "core=$core"
          echo "appearance=$appearance"
          echo "continuity=$continuity"
          echo "social=$social"
          [[ "$core" == 64604d9* ]]
          [[ "$appearance" == 963b08c* ]]
          [[ "$continuity" == 6aaa64a* ]]
          [[ "$social" == 6958faf* ]]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appearance.js continuity-core.js social.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: assemble reviewed runtime blobs"
            git push origin HEAD:tmp/delta-six-fixes-bootstrap
          fi
