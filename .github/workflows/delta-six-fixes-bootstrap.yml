name: Delta six-fix bootstrap

on:
  push:
    branches:
      - tmp/delta-six-fixes-bootstrap

permissions:
  contents: write

jobs:
  assemble-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/delta-six-fixes-bootstrap
          fetch-depth: 0
      - name: Reconcile exact reviewed core blob
        shell: bash
        run: |
          set -euo pipefail
          expected_prefix="64604d9"
          candidate_prefix="97fad6c"
          current_blob="$(git hash-object core-mechanics.js)"
          if [[ "$current_blob" == ${expected_prefix}* ]]; then
            echo "Exact reviewed core blob already assembled: $current_blob"
            exit 0
          fi
          if [[ "$current_blob" == ${candidate_prefix}* ]]; then
            python3 - <<'PY'
          from pathlib import Path
          path = Path('core-mechanics.js')
          text = path.read_text(encoding='utf-8')
          needle = "    if (durableClaimPolarityConflict(source, accepted)) return false;\n    const claimClauses = splitDurableClaimUnits(source);"
          replacement = "    if (durableClaimPolarityConflict(source, accepted)) return false;\n\n    const claimClauses = splitDurableClaimUnits(source);"
          if needle not in text:
              raise SystemExit('expected reconciliation anchor not found')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
          else
            git apply --recount --check .github/delta-six-fixes-core.patch
            git apply --recount .github/delta-six-fixes-core.patch
            python3 - <<'PY'
          from pathlib import Path
          path = Path('core-mechanics.js')
          text = path.read_text(encoding='utf-8')
          needle = "    if (durableClaimPolarityConflict(source, accepted)) return false;\n    const claimClauses = splitDurableClaimUnits(source);"
          replacement = "    if (durableClaimPolarityConflict(source, accepted)) return false;\n\n    const claimClauses = splitDurableClaimUnits(source);"
          if needle not in text:
              raise SystemExit('expected reconciliation anchor not found')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
          fi
          assembled_blob="$(git hash-object core-mechanics.js)"
          echo "Reconciled core blob: $assembled_blob"
          [[ "$assembled_blob" == ${expected_prefix}* ]]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core-mechanics.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: reconcile reviewed core mechanics blob"
            git push origin HEAD:tmp/delta-six-fixes-bootstrap
          fi
