name: Stage 8 Publish Candidate

on:
  push:
    branches: [stage8-supporting-tools]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct exact reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .stage8/chunk-* > /tmp/stage8.patch.gz.b64
          base64 -d /tmp/stage8.patch.gz.b64 | gzip -d > /tmp/stage8.patch
          test "$(sha256sum /tmp/stage8.patch | awk '{print $1}')" = "5e29bd7d0bc2ff3f85ec5a92b06a87d71e7aed3cf73e2fe4075541334f299f8e"
          git apply --index /tmp/stage8.patch
          rm -rf .stage8 .github/workflows/stage8-publish.yml
          git add -A
          tree="$(git write-tree)"
          echo "candidate tree: ${tree}"
          test "${tree}" = "a3aff9c86cdaec4c17856326c98aee1c45e715a6"
          git diff --cached --check

      - name: Commit and push exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kohz87"
          git config user.email "83744063+kohz87@users.noreply.github.com"
          git commit -m "stage8: complete portrait tools, native import/export, and diagnostics"
          test "$(git rev-parse HEAD^{tree})" = "a3aff9c86cdaec4c17856326c98aee1c45e715a6"
          git push origin HEAD:stage8-supporting-tools
