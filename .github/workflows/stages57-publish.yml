name: Stage 5-7 Publish Candidate

on:
  push:
    branches: [work/stages5-7-review]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Reconstruct exact reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .stage57/chunk-* > /tmp/stages57.patch.gz.b64
          base64 -d /tmp/stages57.patch.gz.b64 | gzip -d > /tmp/stages57.patch
          git apply --index /tmp/stages57.patch
          rm -rf .stage57 .github/workflows/stages57-publish.yml
          git add -A
          tree="$(git write-tree)"
          echo "candidate tree: ${tree}"
          test "${tree}" = "26cf027c41a07ef135caaed057d97097bae633ca"
          git diff --cached --check

      - name: Verify exact candidate
        run: |
          set -euo pipefail
          npm test
          npm run validate
          npm run measure:prompts
          npm run package

      - name: Commit and push verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kohz87"
          git config user.email "83744063+kohz87@users.noreply.github.com"
          git commit -m "stages5-7: preserve scoring and recovery, fix continuity integration, remove OOC commands"
          test "$(git rev-parse HEAD^{tree})" = "26cf027c41a07ef135caaed057d97097bae633ca"
          git push origin HEAD:work/stages5-7-review
