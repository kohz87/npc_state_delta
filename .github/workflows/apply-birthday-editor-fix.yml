name: Apply birthday editor fix

on:
  push:
    branches:
      - fix/edit-dossier-birthday

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: fix/edit-dossier-birthday
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply patch
        run: python3 scripts/apply-birthday-editor-fix.py
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --check index.js
          node --test tests/birthday-continuity.test.js tests/index-hardening.test.js
          npm test
          npm run validate
          npm run measure:prompts
          npm run package
          git diff --check
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NPC State Delta automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/apply-birthday-editor-fix.yml scripts/apply-birthday-editor-fix.py
          git add index.js tests/index-hardening.test.js docs/core-contract.md docs/birthday-continuity.md CHANGELOG.md
          git commit -m 'fix: allow manual birthday corrections'
          git push origin HEAD:fix/edit-dossier-birthday
