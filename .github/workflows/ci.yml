name: NPC State Delta CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Syntax and diff check
        run: |
          node --check bootstrap.js
          node --check hardening.js
          node --check hardening-core.js
          node --check index.js
          node --check core.js
          node --check core-v0218.js
          node --check branch.js
          node --check branch-v0218.js
          node --check bundle.js
          node --check full-cast.js
          node --check dossier-ui.js
          node --check launcher-ui.js
          node --check social.js
          node --check storage.js
          node --check identity.js
          git diff --check
      - name: Full verification
        run: npm test
      - name: Delta validation and prompt measurement
        run: |
          npm run validate
          npm run measure:prompts
      - name: Verify runtime package
        run: npm run package
      - name: Release consistency
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const core = fs.readFileSync('core.js', 'utf8');
          const readme = fs.readFileSync('README.md', 'utf8');
          const bootstrap = fs.readFileSync('bootstrap.js', 'utf8');
          const escaped = String(manifest.version).replaceAll('.', '\\.');
          if (!new RegExp(`NPC_STATE_VERSION = ['\"]${escaped}['\"]`).test(core)) throw new Error('core version does not match manifest');
          if (pkg.version !== manifest.version) throw new Error('package version does not match manifest');
          if (!readme.startsWith(`# NPC State Delta v${manifest.version}`)) throw new Error('README version does not match manifest');
          if (manifest.js !== 'bootstrap.js') throw new Error('manifest must load bootstrap.js');
          if (bootstrap.includes('enhancements.js')) throw new Error('superseded enhancements wrapper is still loaded');
          if (!bootstrap.includes("await import('./full-cast.js')")) throw new Error('full-cast owner must be loaded');
          const prepareAt = bootstrap.indexOf('await prepareNpcStateHardening()');
          const engineAt = bootstrap.indexOf("await import('./index.js')");
          if (prepareAt < 0 || engineAt < 0 || prepareAt > engineAt) throw new Error('hardening must initialize before the retained engine');
          NODE
